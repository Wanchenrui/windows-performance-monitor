name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run tests
        run: python -m pytest

  contract-dotnet:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.302"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked .NET dependencies
        run: dotnet restore .\PerfMonitor.slnx --locked-mode

      - name: Run contract, Agent, differential, and soak gates
        run: dotnet test .\PerfMonitor.slnx --configuration Release --no-restore

      - name: Publish and smoke-test .NET Agent
        shell: powershell
        run: |
          dotnet publish .\src\PerfMonitor.Agent\PerfMonitor.Agent.csproj `
            --configuration Release --no-restore `
            --output .\artifacts\agent
          if ($LASTEXITCODE -ne 0) { throw ".NET Agent publish failed" }
          .\artifacts\agent\perf-monitor-agent.exe `
            --once --warmup-seconds 3 `
            --output .\artifacts\agent-snapshot.json
          if ($LASTEXITCODE -ne 0) { throw ".NET Agent smoke test failed" }
          $Snapshot = Get-Content `
            -LiteralPath .\artifacts\agent-snapshot.json |
            Select-Object -Last 1 |
            ConvertFrom-Json
          if ($Snapshot.contractVersion -ne "1.0") {
            throw "Unexpected contract version"
          }
          if ($Snapshot.productVersion -ne "0.4.0") {
            throw "Unexpected product version"
          }
          foreach ($Group in @(
            "systemCpu", "memory", "volumes", "uptime",
            "processes", "sampler", "self")) {
            if ($Snapshot.groups.PSObject.Properties.Name -notcontains $Group) {
              throw "Missing Agent group: $Group"
            }
          }

      - name: Upload .NET Agent evidence
        uses: actions/upload-artifact@v4
        with:
          name: perf-monitor-agent-${{ github.sha }}
          path: |
            artifacts/agent/**
            artifacts/agent-snapshot.json
          if-no-files-found: error
          retention-days: 14

  build-and-smoke:
    needs: [test, contract-dotnet]
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create verified Python 3.12 environment
        shell: powershell
        run: .\scripts\setup.ps1

      - name: Build Windows executable
        shell: powershell
        run: .\scripts\build.ps1

      - name: Smoke-test executable lifecycle
        shell: powershell
        run: .\scripts\smoke.ps1

      - name: Upload executable and build manifest
        uses: actions/upload-artifact@v4
        with:
          name: perf-monitor-${{ github.sha }}
          path: |
            dist/perf-monitor.exe
            dist/build-manifest.json
          if-no-files-found: error
          retention-days: 14
