name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run tests
        run: python -m pytest

  contract-dotnet:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.302"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up Python oracle
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create verified Python oracle environment
        shell: powershell
        run: .\scripts\setup.ps1

      - name: Restore locked .NET dependencies
        run: dotnet restore .\PerfMonitor.slnx --locked-mode

      - name: Run .NET contract, Agent, and virtual 72-hour gates
        run: dotnet test .\PerfMonitor.slnx --configuration Release --no-restore

      - name: Publish and smoke-test .NET Agent
        shell: pwsh
        run: |
          [xml]$BuildProperties = Get-Content `
            -LiteralPath .\Directory.Build.props `
            -Raw
          $VersionNode = $BuildProperties.SelectSingleNode(
            "/Project/PropertyGroup/Version"
          )
          if ($null -eq $VersionNode) {
            throw "Directory.Build.props is missing Version"
          }
          $ExpectedProductVersion = $VersionNode.InnerText.Trim()
          dotnet publish .\src\PerfMonitor.Agent\PerfMonitor.Agent.csproj `
            --configuration Release --no-restore `
            --output .\artifacts\agent
          if ($LASTEXITCODE -ne 0) { throw ".NET Agent publish failed" }
          dotnet publish `
            .\src\PerfMonitor.ProviderWorker\PerfMonitor.ProviderWorker.csproj `
            --configuration Release --no-restore `
            --output .\artifacts\agent\provider-worker
          if ($LASTEXITCODE -ne 0) {
            throw ".NET Provider Worker publish failed"
          }
          if (
            Test-Path `
              -LiteralPath .\artifacts\agent\LibreHardwareMonitorLib.dll
          ) {
            throw "Hardware library leaked into Agent root"
          }
          if (-not (
            Test-Path `
              -LiteralPath (
                ".\artifacts\agent\provider-worker\" +
                "LibreHardwareMonitorLib.dll"
              )
          )) {
            throw "Provider Worker is missing its fixed hardware library"
          }
          .\scripts\smoke_provider_worker.ps1 `
            -WorkerPath (
              ".\artifacts\agent\provider-worker\" +
              "perf-monitor-provider-worker.exe"
            )
          .\artifacts\agent\perf-monitor-agent.exe `
            --once --quiet --warmup-seconds 15 `
            --output .\artifacts\agent-snapshot.json
          if ($LASTEXITCODE -ne 0) { throw ".NET Agent smoke test failed" }
          $Snapshot = Get-Content `
            -LiteralPath .\artifacts\agent-snapshot.json |
            Select-Object -Last 1 |
            ConvertFrom-Json
          if ($Snapshot.contractVersion -ne "1.0") {
            throw "Unexpected contract version"
          }
          if ($Snapshot.productVersion -ne $ExpectedProductVersion) {
            throw "Unexpected product version"
          }
          foreach ($Group in @(
            "systemCpu", "memory", "network", "diskIo", "power",
            "gpu", "sensors",
            "volumes", "uptime",
            "processes", "sampler", "self")) {
            if ($Snapshot.groups.PSObject.Properties.Name -notcontains $Group) {
              throw "Missing Agent group: $Group"
            }
          }
          foreach ($Group in @("gpu", "sensors")) {
            $HardwareGroup = (
              $Snapshot.groups.PSObject.Properties[$Group].Value
            )
            if (-not $HardwareGroup.data.workerInstanceId) {
              throw "Hardware Worker handshake missing for group: $Group"
            }
            if ([Int64]$HardwareGroup.data.workerSequence -le 0) {
              throw "Hardware Worker sequence is invalid for group: $Group"
            }
          }
          dotnet publish .\src\PerfMonitor.Desktop\PerfMonitor.Desktop.csproj `
            --configuration Release --no-restore `
            --output .\artifacts\desktop
          if ($LASTEXITCODE -ne 0) { throw ".NET Desktop publish failed" }

      - name: Run Python versus .NET differential gate
        shell: powershell
        run: |
          .\scripts\compare_agents.ps1 `
            -AgentPath .\artifacts\agent\perf-monitor-agent.exe `
            -Samples 15 `
            -OutputPath .\artifacts\agent-differential.json

      - name: Run accelerated live resource soak gate
        shell: powershell
        run: |
          .\scripts\run_agent_soak.ps1 `
            -AgentPath .\artifacts\agent\perf-monitor-agent.exe `
            -DurationSeconds 45 `
            -WarmupSeconds 3 `
            -ProbeIntervalSeconds 5 `
            -SnapshotPeriodSeconds 5 `
            -OutputPath .\artifacts\agent-soak-accelerated.json

      - name: Validate Agent evidence schemas
        shell: powershell
        run: |
          & .\.venv\Scripts\python.exe `
            .\scripts\validate_evidence.py `
            differential-evidence-v1.schema.json `
            .\artifacts\agent-differential.json
          if ($LASTEXITCODE -ne 0) {
            throw "Differential evidence schema validation failed"
          }
          & .\.venv\Scripts\python.exe `
            .\scripts\validate_evidence.py `
            soak-evidence-v1.schema.json `
            .\artifacts\agent-soak-accelerated.json
          if ($LASTEXITCODE -ne 0) {
            throw "Soak evidence schema validation failed"
          }

      - name: Upload .NET Agent evidence
        uses: actions/upload-artifact@v4
        with:
          name: perf-monitor-agent-${{ github.sha }}
          path: |
            artifacts/agent/**
            artifacts/desktop/**
            artifacts/agent-snapshot.json
            artifacts/agent-differential.json
            artifacts/agent-soak-accelerated.json
          if-no-files-found: error
          retention-days: 14

  build-and-smoke:
    needs: [test, contract-dotnet]
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.302"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create verified Python 3.12 environment
        shell: powershell
        run: .\scripts\setup.ps1

      - name: Build .NET Agent and Desktop
        shell: powershell
        run: .\scripts\build.ps1

      - name: Smoke-test Agent/Desktop/SQLite lifecycle
        shell: powershell
        run: .\scripts\smoke.ps1

      - name: Upload .NET product and build manifest
        uses: actions/upload-artifact@v4
        with:
          name: perf-monitor-${{ github.sha }}
          path: |
            dist/agent/**
            dist/desktop/**
            dist/build-manifest.json
          if-no-files-found: error
          retention-days: 14
